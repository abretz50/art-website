<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Arturo Tapia-Minchez</title>
  <link rel="stylesheet" href="../styles/site.css" />
</head>
<body data-depth=".." data-page="contact">
  <div class="layout">
    <div id="site-sidebar" class="sidebar-shell"></div>
    <main class="content">
      <div class="content-inner">
        <section class="hero" style="background-image:url('../assets/photos/reading-bench-1.jpg')">
          <h1 class="hero-title">Contact</h1>
          <p class="hero-subtitle">Professional inquiries and messages</p>
          <p class="lede">A clean contact page for commissions, collaborations, performances, and presenter inquiries.</p>
        </section>

<section class="section">
  <div class="grid">
    <article class="card ornate span-12">
      <div class="inner-border"></div>
      <div class="section-head">
        <h2 class="section-title">Send a message</h2>
      </div>
      <form id="contact-form" class="contact-form">
        <div><label>Name</label><input type="text" name="name" placeholder="Your name" required></div>
        <div><label>Email</label><input type="email" name="email" placeholder="Your email" required></div>
        <div><label>Inquiry Type</label><select name="inquiryType"><option>Commission</option><option>Performance</option><option>Collaboration</option><option>General</option></select></div>
        <div><label>Subject</label><input type="text" name="subject" placeholder="Subject"></div>
        <div class="full"><label>Message</label><textarea name="message" placeholder="Write your message here..." required></textarea></div>
        <div class="full"><button class="button" type="submit">Send Message</button></div>
      </form>
    </article>
  </div>
</section>

        <div id="site-footer"></div>
      </div>
    </main>
  </div>
  <script src="../scripts/includes.js"></script>
</body>
</html>
